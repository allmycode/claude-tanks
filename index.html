<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Танки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #141414; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #connect { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); }
  #connect[hidden] { display: none; }
  #connect .box { background: #1c1c1c; border: 3px solid #a8481c; padding: 28px 26px; width: min(460px, calc(100vw - 32px));
                  box-sizing: border-box; font-family: "Press Start 2P", monospace; color: #eee; }
  #connect h2 { margin: 0 0 22px; font-size: 16px; color: #e8b93a; text-align: center; }
  #connect label { display: block; font-size: 10px; margin-bottom: 10px; color: #bbb; }
  #connect input { width: 100%; box-sizing: border-box; padding: 10px; font: 12px "Press Start 2P", monospace;
                   background: #000; color: #fff; border: 2px solid #666; outline: none; }
  #connect input:focus { border-color: #e8b93a; }
  #connect .hint { font-size: 8px; line-height: 1.8; color: #888; margin: 14px 0 22px; }
  #connect .btns { display: flex; gap: 12px; }
  #connect button { flex: 1; padding: 10px 6px; font: 10px "Press Start 2P", monospace; cursor: pointer;
                    background: #a8481c; color: #fff; border: 2px solid #d97a45; }
  #connect button.alt { background: #333; border-color: #666; }
  #connect button:hover { filter: brightness(1.15); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="connect" hidden>
  <div class="box">
    <h2>СЕТЕВАЯ ИГРА</h2>
    <label for="addr">АДРЕС СЕРВЕРА</label>
    <input id="addr" spellcheck="false" autocomplete="off" placeholder="localhost:8081">
    <div class="hint">Сервер запускается командой npm start в папке игры. Оба игрока подключаются к одному адресу.</div>
    <div class="btns"><button id="go">ПОДКЛЮЧИТЬСЯ</button><button id="back" class="alt">НАЗАД</button></div>
  </div>
</div>
<script src="stages.js"></script>
<script src="game.js"></script>
<script>
'use strict';
const { CELL, N, FS, TS, BRICK, STEEL, WATER, BUSH, ICE, DX, DY, BASE_X, BASE_Y, STUN_TIME } = Tanks;
const OX = 24, OY = 24, W = OX + FS + 152, H = OY + FS + 24;
const FONT = '"Press Start 2P", monospace';

const ECOL = [
  ['#c9c9c9', '#5e5e5e', '#ffffff'],
  ['#8fc8f5', '#2f5f86', '#e2f3ff'],
  ['#e0975a', '#7a4318', '#ffd0a6'],
];
const ARMOR_COL = [null,
  ['#c9c9c9', '#5e5e5e', '#ffffff'],
  ['#e0975a', '#7a4318', '#ffd0a6'],
  ['#d6c25a', '#6e611c', '#fff0a6'],
  ['#7fb26a', '#335a28', '#c8f0b4'],
];

// ===== Канвас =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);

function sprite(w, h, f) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  f(c.getContext('2d'));
  return c;
}

// ===== Спрайты тайлов =====
const SPR = {
  brick: sprite(12, 12, g => {
    g.fillStyle = '#6a6a6a'; g.fillRect(0, 0, 12, 12);
    const b = (x, y, w, h) => {
      g.fillStyle = '#a8481c'; g.fillRect(x, y, w, h);
      g.fillStyle = '#d97a45'; g.fillRect(x, y, w, 1);
      g.fillStyle = '#6e2a0c'; g.fillRect(x, y + h - 1, w, 1);
    };
    b(0, 0, 11, 5); b(0, 6, 5, 5); b(6, 6, 6, 5);
  }),
  steel: sprite(12, 12, g => {
    g.fillStyle = '#6f6f6f'; g.fillRect(0, 0, 12, 12);
    g.fillStyle = '#b8b8b8'; g.fillRect(1, 1, 10, 10);
    g.fillStyle = '#f4f4f4'; g.fillRect(1, 1, 10, 2); g.fillRect(1, 1, 2, 10);
    g.fillStyle = '#878787'; g.fillRect(3, 9, 8, 2); g.fillRect(9, 3, 2, 8);
    g.fillStyle = '#dedede'; g.fillRect(4, 4, 4, 4);
  }),
  water: [0, 1].map(k => sprite(12, 12, g => {
    g.fillStyle = '#1d4fc4'; g.fillRect(0, 0, 12, 12);
    g.fillStyle = '#6a98ff';
    for (let i = 0; i < 3; i++) {
      const y = 1 + i * 4, o = (k * 3 + i * 5) % 12;
      g.fillRect(o, y, 4, 1); g.fillRect((o + 7) % 12, y + 2, 3, 1);
    }
  })),
  ice: sprite(12, 12, g => {
    g.fillStyle = '#b9cfe6'; g.fillRect(0, 0, 12, 12);
    g.fillStyle = '#e9f3ff';
    for (let i = 0; i < 12; i++) { g.fillRect(i, 11 - i, 1, 1); g.fillRect((i + 6) % 12, 11 - i, 1, 1); }
    g.fillStyle = '#8eabcc'; g.fillRect(0, 11, 12, 1); g.fillRect(11, 0, 1, 12);
  }),
  bush: sprite(12, 12, g => {
    const blob = (x, y, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
    blob(3, 3, 3.6, '#1d5e17'); blob(9, 3, 3.6, '#1d5e17'); blob(3, 9, 3.6, '#1d5e17'); blob(9, 9, 3.6, '#1d5e17');
    blob(6, 6, 3.4, '#2f8a22');
    g.fillStyle = '#6cc84a';
    [[2, 2], [8, 2], [5, 5], [2, 8], [9, 8], [6, 10]].forEach(([x, y]) => g.fillRect(x, y, 2, 1));
  }),
};

// ===== Звук =====
let AC = null, noiseBuf = null, muted = false;
function initAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const n = AC.sampleRate;
      noiseBuf = AC.createBuffer(1, n, n);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, dur, type = 'square', vol = 0.06, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.15, freq = 1200) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf;
  f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(AC.destination);
  s.start(t); s.stop(t + dur);
}
const SFX = {
  shoot: () => tone(700, 180, 0.09, 'square', 0.045),
  brick: () => noise(0.14, 0.13, 2600),
  steel: () => tone(1900, 1400, 0.07, 'triangle', 0.07),
  armor: () => tone(500, 900, 0.08, 'square', 0.05),
  track: () => { tone(260, 70, 0.16, 'sawtooth', 0.06); noise(0.12, 0.12, 3200); },
  boom: () => { noise(0.7, 0.32, 900); tone(120, 40, 0.5, 'sine', 0.15); },
  bonusAppear: () => [660, 880, 660, 880].forEach((f, i) => tone(f, f, 0.06, 'square', 0.04, i * 0.06)),
  power: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f, 0.08, 'square', 0.05, i * 0.06)),
  start: () => [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'square', 0.05, i * 0.12)),
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.15, 'triangle', 0.08, i * 0.13)),
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.98, 0.25, 'triangle', 0.08, i * 0.22)),
};

// ===== Состояние клиента =====
// mode: menu | connect | local | net.  V — то, что рисуем: состояние локальной игры или снимок с сервера.
let mode = 'menu', menuSel = 0, menuMsg = '', menuMsgT = 0;
let startStage = 1;                       // уровень, с которого начинается игра на одном компьютере
const STAGE_MAX = Math.max(1, Tanks.CLASSIC_STAGES);
function changeStage(d) { startStage = (startStage - 1 + d + STAGE_MAX) % STAGE_MAX + 1; }
let game = null, V = null;
let effects = [], particles = [], popups = [], shake = 0, time = 0;
let hiscore = 0, hiDirty = false, lastState = '';
try { hiscore = +localStorage.getItem('tanks-hiscore') || 0; } catch (e) {}

// События логики: звуки и эффекты
function handleEvent(ev) {
  switch (ev[0]) {
    case 'sfx': if (SFX[ev[1]]) SFX[ev[1]](); break;
    case 'boom': addBoom(ev[1], ev[2], !!ev[3]); break;
    case 'debris': debris(ev[1], ev[2], ev[3]); break;
    case 'popup': popups.push({ x: ev[1], y: ev[2], text: ev[3], t: 1 }); break;
    case 'shake': shake = Math.max(shake, ev[1]); break;
  }
}
function resetFx() { effects = []; particles = []; popups = []; shake = 0; }

// ===== Эффекты =====
function addBoom(x, y, big) {
  effects.push({ x, y, t: 0, dur: big ? 0.65 : 0.22, big });
  const n = big ? 22 : 6;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(30, big ? 220 : 90);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, dur: rand(0.25, big ? 0.8 : 0.35),
                     c: ['#fff6b0', '#ffc23a', '#ff7a1a', '#ff3d00'][Math.floor(Math.random() * 4)], s: big ? 3 : 2 });
  }
}
function debris(x, y, c) {
  for (let i = 0; i < 2; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(30, 110);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, dur: rand(0.2, 0.45), c, s: 2 });
  }
}
function smoke(t) {
  const rd = (t.dir + 1) % 4;
  particles.push({ x: t.x + 24 + DX[rd] * 17 * t.stunSide + rand(-4, 4), y: t.y + 24 + DY[rd] * 17 * t.stunSide + rand(-4, 4),
                   vx: rand(-10, 10), vy: rand(-35, -15), t: 0, dur: rand(0.5, 0.9), c: '#8a8a8a', s: 4 });
}
function updateFx(dt) {
  if (shake > 0) shake -= dt;
  for (const f of effects) f.t += dt;
  effects = effects.filter(f => f.t < f.dur);
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; }
  particles = particles.filter(p => p.t < p.dur);
  for (const p of popups) { p.t -= dt; p.y -= 20 * dt; }
  popups = popups.filter(p => p.t > 0);
  if (V && !V.paused) {
    for (const t of V.players.concat(V.enemies)) {
      if (t.alive && t.stun > 0 && Math.random() < dt * 10) smoke(t);
    }
  }
}

// ===== Управление =====
const keys = {};
const MAP1 = { KeyW: 0, KeyD: 1, KeyS: 2, KeyA: 3 };
const MAP2 = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
const dirStack = [[], []];
const GAME_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter']);
// Раздельное управление (WASD / стрелки) — только при игре вдвоём за одним компьютером
const splitKeys = () => mode === 'local' && V && V.twoP;
function mapFor(code) {
  if (code in MAP1) return [0, MAP1[code]];
  if (code in MAP2) return [splitKeys() ? 1 : 0, MAP2[code]];
  return null;
}
function inputDir(id) {
  const p = padFor(id);
  if (p && p.dir >= 0) return p.dir;
  const s = dirStack[id];
  return s.length ? s[s.length - 1].d : -1;
}
function fireHeld(id) {
  const p = padFor(id);
  if (p && p.fire) return true;
  if (id === 0) return !!(keys.Space || (!splitKeys() && (keys.Enter || keys.KeyJ || keys.NumpadEnter || keys.KeyK)));
  return !!(keys.Enter || keys.NumpadEnter || keys.Numpad0 || keys.ControlRight || keys.ShiftRight);
}

// ===== Геймпады (Gamepad API, стандартная раскладка) =====
// Крестовина или левый стик — движение, A/B/X/Y/RB/RT — огонь, Start — пауза, Back/Select — выход.
let pads = [], padPrev = {};
function readPads() {
  const raw = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(g => g && g.connected) : [];
  pads = raw.map(gp => {
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    let dir = b(12) ? 0 : b(15) ? 1 : b(13) ? 2 : b(14) ? 3 : -1;
    if (dir < 0) {
      const x = gp.axes[0] || 0, y = gp.axes[1] || 0;
      if (Math.max(Math.abs(x), Math.abs(y)) > 0.5) dir = Math.abs(x) > Math.abs(y) ? (x > 0 ? 1 : 3) : (y > 0 ? 2 : 0);
    }
    return { index: gp.index, dir, a: b(0), b: b(1), start: b(9), back: b(8),
             fire: b(0) || b(1) || b(2) || b(3) || b(5) || b(7) };
  });
}
// Вдвоём за одним компьютером: два геймпада — по одному на игрока, один — второму игроку.
// В остальных режимах любой геймпад управляет своим танком.
function padFor(id) {
  if (!pads.length) return null;
  if (splitKeys()) return pads.length >= 2 ? pads[id] : (id === 1 ? pads[0] : null);
  if (id !== 0) return null;
  const withDir = pads.find(p => p.dir >= 0);
  return { dir: withDir ? withDir.dir : -1, fire: pads.some(p => p.fire) };
}
// Нажатия кнопок геймпада в меню и на служебных экранах
function padActions() {
  for (const p of pads) {
    const prev = padPrev[p.index] || {};
    padPrev[p.index] = p;
    const hit = k => p[k] && !prev[k];
    const ok = hit('a') || hit('start');
    const vert = p.dir !== prev.dir && (p.dir === 0 || p.dir === 2) ? p.dir : -1;
    if (ok || hit('back')) initAudio();
    if (mode === 'menu') {
      if (vert === 0) menuSel = (menuSel + 2) % 3;
      if (vert === 2) menuSel = (menuSel + 1) % 3;
      if (p.dir !== prev.dir && p.dir === 1) changeStage(1);
      if (p.dir !== prev.dir && p.dir === 3) changeStage(-1);
      if (ok) menuSelect();
    } else if (mode === 'connect') {
      if (ok) connect(addrEl.value.trim());
      else if (hit('b') || hit('back')) closeConnect();
    } else if (mode === 'local') {
      if (V.state === 'over') { if (ok && V.stateT <= 0) toMenu(); }
      else if (hit('start')) game.togglePause();
      else if (hit('back') && V.paused) toMenu();
    } else if (mode === 'net') {
      if (hit('back')) { leaveNet(); return; }
      if (net.status === 'playing') {
        if (V && V.state === 'over') { if (ok && V.stateT <= 0) netSend({ t: 'restart' }); }
        else if (hit('start')) netSend({ t: 'pause' });
      } else if (net.status === 'error' && ok) toMenu();
    }
  }
}
addEventListener('gamepadconnected', e => { menuMsg = 'ГЕЙМПАД ПОДКЛЮЧЁН'; menuMsgT = 3; });
addEventListener('gamepaddisconnected', e => { menuMsg = 'ГЕЙМПАД ОТКЛЮЧЁН'; menuMsgT = 3; delete padPrev[e.gamepad.index]; });
function clearKeys() { for (const k in keys) keys[k] = false; dirStack[0].length = dirStack[1].length = 0; }

addEventListener('keydown', e => {
  if (mode === 'connect') return;                 // ввод адреса обрабатывает форма
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  initAudio();
  if (e.repeat) return;
  keys[e.code] = true;
  const m = mapFor(e.code);
  if (m) {
    const s = dirStack[m[0]];
    const i = s.findIndex(o => o.code === e.code);
    if (i >= 0) s.splice(i, 1);
    s.push({ code: e.code, d: m[1] });
  }
  if (e.code === 'KeyM') muted = !muted;
  const ok = e.code === 'Enter' || e.code === 'Space';

  if (mode === 'menu') {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') menuSel = (menuSel + 2) % 3;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') menuSel = (menuSel + 1) % 3;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') changeStage(1);
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeStage(-1);
    if (ok) menuSelect();
  } else if (mode === 'local') {
    if (V.state === 'over') { if (ok && V.stateT <= 0) toMenu(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') game.togglePause();
    else if (e.code === 'KeyQ' && V.paused) toMenu();
  } else if (mode === 'net') {
    if (e.code === 'Escape') { leaveNet(); return; }
    if (net.status === 'playing') {
      if (e.code === 'KeyP') netSend({ t: 'pause' });
      if (ok && V.state === 'over' && V.stateT <= 0) netSend({ t: 'restart' });
    } else if (net.status === 'error' && ok) toMenu();
  }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  for (const s of dirStack) { const i = s.findIndex(o => o.code === e.code); if (i >= 0) s.splice(i, 1); }
});
addEventListener('blur', clearKeys);

// ===== Режимы =====
function menuSelect() {
  if (menuSel < 2) startLocal(menuSel === 1); else openConnect();
}
function startLocal(two) {
  game = Tanks.createGame({ emit: (...ev) => handleEvent(ev) });
  game.startGame(two, startStage);
  V = game.G;
  mode = 'local';
  resetFx();
}
function toMenu() {
  if (net.ws) { net.ws.onclose = null; net.ws.close(); net.ws = null; }
  saveHi();
  mode = 'menu'; game = null; V = null;
  clearKeys();
  resetFx();
}
function trackHiscore() {
  if (!V) return;
  const best = Math.max(0, ...V.players.map(p => p.score));
  if (best > hiscore) { hiscore = best; hiDirty = true; }
  if (V.state !== lastState && (V.state === 'over' || V.state === 'done')) saveHi();
  lastState = V.state;
}
function saveHi() {
  if (!hiDirty) return;
  hiDirty = false;
  try { localStorage.setItem('tanks-hiscore', String(hiscore)); } catch (e) {}
}

// ===== Сеть =====
const net = { ws: null, status: '', slot: 0, addr: '', msg: '', notice: '', noticeT: 0, lastSent: '', snapAt: 0, snapGap: 25 };
const connectEl = document.getElementById('connect'), addrEl = document.getElementById('addr');

function defaultAddr() {
  try { const a = localStorage.getItem('tanks-server'); if (a) return a; } catch (e) {}
  return location.protocol.startsWith('http') && location.host ? location.host : 'localhost:8081';
}
function openConnect() {
  mode = 'connect';
  clearKeys();
  connectEl.hidden = false;
  addrEl.value = defaultAddr();
  addrEl.focus();
  addrEl.select();
}
function closeConnect() {
  connectEl.hidden = true;
  addrEl.blur();
  mode = 'menu';
}
document.getElementById('go').onclick = () => connect(addrEl.value.trim());
document.getElementById('back').onclick = closeConnect;
connectEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); connect(addrEl.value.trim()); }
  if (e.key === 'Escape') { e.preventDefault(); closeConnect(); }
});

function newNetView() {
  return { state: 'intro', stateT: 2, level: 1, twoP: true, paused: false, freeze: 0, baseAlive: true,
           players: [], enemies: [], bullets: [], powerups: [], stars: [], queue: [],
           grid: new Uint8Array(N * N), gridVer: 0 };
}
function connect(addr) {
  if (!addr) return;
  try { localStorage.setItem('tanks-server', addr); } catch (e) {}
  const url = /^wss?:\/\//i.test(addr) ? addr : (location.protocol === 'https:' ? 'wss://' : 'ws://') + addr;
  connectEl.hidden = true;
  addrEl.blur();
  let ws;
  try { ws = new WebSocket(url); } catch (e) {
    mode = 'menu'; menuMsg = 'НЕВЕРНЫЙ АДРЕС'; menuMsgT = 4;
    return;
  }
  Object.assign(net, { ws, status: 'connecting', addr, msg: '', notice: '', lastSent: '' });
  mode = 'net';
  V = null;
  resetFx();
  let opened = false;
  ws.onopen = () => { opened = true; net.status = 'waiting'; };
  ws.onmessage = e => {
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    switch (m.t) {
      case 'wait': net.status = 'waiting'; V = null; break;
      case 'start':
        net.status = 'playing'; net.slot = m.slot; net.lastSent = ''; net.snapAt = 0;
        V = newNetView(); lastState = ''; resetFx();
        break;
      case 'left':
        net.notice = 'СОПЕРНИК ОТКЛЮЧИЛСЯ'; net.noticeT = 4;
        saveHi();
        break;
      case 's':
        if (net.status === 'playing' && V) applySnapshot(m);
        break;
    }
  };
  ws.onclose = () => {
    if (net.ws !== ws) return;
    net.ws = null;
    saveHi();
    net.status = 'error';
    net.msg = opened ? 'СОЕДИНЕНИЕ ПОТЕРЯНО' : 'НЕ УДАЛОСЬ ПОДКЛЮЧИТЬСЯ';

}
function netSend(m) { if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(m)); }
function leaveNet() { toMenu(); }
function sendInput() {
  const d = inputDir(0), f = fireHeld(0) ? 1 : 0, key = d + ',' + f;
  if (key !== net.lastSent) { netSend({ t: 'in', d, f }); net.lastSent = key; }
}
// Снимки приходят реже кадров, поэтому позиции плавно ведём от прошлого снимка к текущему
function withPrev(list, prevList) {
  const prev = new Map(prevList.map(o => [o.id, o]));
  for (const o of list) {
    const p = prev.get(o.id);
    const near = p && Math.abs(p.sx - o.sx) + Math.abs(p.sy - o.sy) < 40;
    o.px = near ? p.x : o.sx; o.py = near ? p.y : o.sy;
    o.x = o.px; o.y = o.py;
  }
  return list;
}
function interpolate() {
  const a = Math.min(1, (performance.now() - net.snapAt) / net.snapGap);
  for (const list of [V.players, V.enemies, V.bullets]) {
    for (const o of list) { o.x = o.px + (o.sx - o.px) * a; o.y = o.py + (o.sy - o.py) * a; }
  }
}
function applySnapshot(m) {
  const v = V, now = performance.now();
  if (net.snapAt) net.snapGap = net.snapGap * 0.8 + Math.min(100, now - net.snapAt) * 0.2;
  net.snapAt = now;
  v.state = m.st; v.stateT = m.stT; v.level = m.lv; v.paused = m.pa; v.freeze = m.fr; v.baseAlive = m.ba; v.queue = m.q;
  v.players = withPrev(m.pl.map((a, i) => ({ id: i, isPlayer: true, alive: !!a[0], sx: a[1], sy: a[2], dir: a[3], lives: a[4],
    score: a[5], level: a[6], shield: a[7], stun: a[8], stunSide: a[9], anim: a[10] })), v.players);
  v.enemies = withPrev(m.en.map(a => ({ isPlayer: false, alive: true, sx: a[0], sy: a[1], dir: a[2], type: a[3], hp: a[4],
    bonus: !!a[5], stun: a[6], stunSide: a[7], anim: a[8], id: a[9] })), v.enemies);
  v.bullets = withPrev(m.bu.map(a => ({ sx: a[0], sy: a[1], dir: a[2], player: !!a[3], id: a[4] })), v.bullets);
  v.powerups = m.pu.map(a => ({ type: a[0], x: a[1], y: a[2], t: a[3] }));
  v.stars = m.sr.map(x => ({ x, y: 0 }));
  if (m.g) { for (let i = 0; i < m.g.length; i++) v.grid[i] = m.g.charCodeAt(i) - 48; v.gridVer++; }
  if (m.gc) { for (let i = 0; i < m.gc.length; i += 2) v.grid[m.gc[i]] = m.gc[i + 1]; v.gridVer++; }
  for (const ev of m.ev) handleEvent(ev);
}

const mapC = document.createElement('canvas'), bushC = document.createElement('canvas');
mapC.width = mapC.height = bushC.width = bushC.height = FS;
const mg = mapC.getContext('2d'), bg = bushC.getContext('2d');
let drawnGrid = null, drawnVer = -1, lastWF = -1;
function renderMap(grid, wf) {
  mg.clearRect(0, 0, FS, FS); bg.clearRect(0, 0, FS, FS);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    // спрайты 12×12, а клетка 6×6: рисуем нужную четверть спрайта
    const v = grid[r * N + c], x = c * CELL, y = r * CELL, sx = (c % 2) * CELL, sy = (r % 2) * CELL;
    const img = v === BRICK ? SPR.brick : v === STEEL ? SPR.steel : v === WATER ? SPR.water[wf] : v === BUSH ? SPR.bush
              : v === ICE ? SPR.ice : null;
    if (img) (v === BUSH ? bg : mg).drawImage(img, sx, sy, CELL, CELL, x, y, CELL, CELL);
  }
}

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function text(s, x, y, size, color = '#fff', align = 'center') {
  ctx.font = size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function starPath(cx, cy, R, r, n = 5) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R;
    ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  ctx.closePath();
}

function tankColors(t) {
  if (t.isPlayer) return t.id ? ['#54b843', '#2a6a1f', '#a6eb88'] : ['#e8b93a', '#86600e', '#fff0a0'];
  if (t.bonus && Math.floor(time * 8) % 2) return ['#e0403a', '#7a1414', '#ffa0a0'];
  return t.type === 3 ? ARMOR_COL[Math.max(1, t.hp)] : ECOL[t.type];
}
function drawTank(t) {
  const [main, dark, light] = tankColors(t);
  const fast = !t.isPlayer && t.type === 1, armor = !t.isPlayer && t.type === 3, power = !t.isPlayer && t.type === 2;
  ctx.save();
  ctx.translate(t.x + 24, t.y + 24);
  ctx.rotate(t.dir * Math.PI / 2);
  // гусеницы
  const tw = fast ? 10 : 12, tx = fast ? 21 : 23;
  ctx.fillStyle = '#161616';
  ctx.fillRect(-tx, -22, tw, 44); ctx.fillRect(tx - tw, -22, tw, 44);
  ctx.fillStyle = dark;
  const off = t.anim % 6;
  for (let i = 0; i < 8; i++) {
    const y = -22 + ((i * 6 + off) % 44);
    if (y > 20) continue;
    ctx.fillRect(-tx + 1, y, tw - 2, 2); ctx.fillRect(tx - tw + 1, y, tw - 2, 2);
  }
  if (t.stun > 0) {
    // перебитая гусеница: разрыв, болтающиеся траки и искры
    const sx = t.stunSide > 0 ? tx - tw : -tx;
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 1, -5, tw + 2, 10);
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(sx + (t.stunSide > 0 ? tw - 1 : -4), 4, 5, 3);
    ctx.fillRect(sx + (t.stunSide > 0 ? tw : -5), 7, 4, 3);
    if (Math.floor(time * 14) % 2) {
      ctx.fillStyle = '#ffc040';
      ctx.fillRect(sx + 2, -4, 3, 3); ctx.fillRect(sx + tw - 4, 1, 2, 2);
    }
  }
  // корпус
  const bw = fast ? 22 : armor ? 30 : 26, bh = fast ? 30 : armor ? 38 : 34;
  ctx.fillStyle = dark; ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
  ctx.fillStyle = main; ctx.fillRect(-bw / 2 + 2, -bh / 2 + 2, bw - 4, bh - 4);
  ctx.fillStyle = light; ctx.fillRect(-bw / 2 + 2, -bh / 2 + 2, bw - 4, 2);
  if (armor) {
    ctx.fillStyle = dark;
    ctx.fillRect(-bw / 2 + 4, -bh / 2 + 5, bw - 8, 3);
    ctx.fillRect(-bw / 2 + 4, bh / 2 - 8, bw - 8, 3);
  }
  ctx.fillStyle = dark; ctx.fillRect(-bw / 2 + 4, bh / 2 - 5, bw - 8, 2);
  // ствол
  const bl = power ? 27 : 25, bwid = armor || (t.isPlayer && t.level >= 2) ? 7 : 5;
  const barrel = x => {
    ctx.fillStyle = dark; ctx.fillRect(x - bwid / 2 - 1, -bl, bwid + 2, bl);
    ctx.fillStyle = light; ctx.fillRect(x - bwid / 2, -bl + 1, bwid, bl - 6);
  };
  if (t.isPlayer && t.level >= 3) { barrel(-4); barrel(4); } else barrel(0);
  // башня
  ctx.fillStyle = dark; circle(0, 3, 10.5);
  ctx.fillStyle = main; circle(0, 3, 9);
  ctx.fillStyle = light; circle(-2.5, 0.5, 3.5);
  if (t.isPlayer && t.level >= 1) {
    ctx.fillStyle = dark; starPath(0, 4, 5, 2.2); ctx.fill();
  }
  ctx.restore();

  if (t.shield > 0 && (t.shield > 1.5 || Math.floor(time * 10) % 2)) {
    ctx.save();
    ctx.translate(t.x + 24, t.y + 24);
    ctx.rotate(time * 4);
    ctx.strokeStyle = 'rgba(140,220,255,0.9)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.arc(0, 0, 29, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  if (t.stun > 0) {
    // полоска ремонта
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(t.x + 4, t.y - 7, 40, 5);
    ctx.fillStyle = '#ff9a2a'; ctx.fillRect(t.x + 5, t.y - 6, 38 * (1 - t.stun / STUN_TIME), 3);
  }
  if (!t.isPlayer && V && V.freeze > 0) {
    ctx.fillStyle = 'rgba(120,200,255,0.25)';
    ctx.fillRect(t.x + 2, t.y + 2, TS - 4, TS - 4);
  }
}

function drawBase() {
  const cx = BASE_X + 24, cy = BASE_Y + 24;
  if (V.baseAlive) {
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(BASE_X, BASE_Y, TS, TS);
    ctx.fillStyle = '#d8d8d8';

    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 4, cy - 6);
      ctx.lineTo(cx + s * 21, cy - 16);
      ctx.lineTo(cx + s * 20, cy - 8);
      ctx.lineTo(cx + s * 22, cy - 6);
      ctx.lineTo(cx + s * 18, cy + 2);
      ctx.lineTo(cx + s * 19, cy + 6);
      ctx.lineTo(cx + s * 6, cy + 10);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillRect(cx - 5, cy - 12, 10, 26);
    circle(cx, cy - 14, 5);
    ctx.beginPath(); ctx.moveTo(cx - 9, cy + 20); ctx.lineTo(cx + 9, cy + 20); ctx.lineTo(cx, cy + 10); ctx.fill();
    ctx.fillStyle = '#f0c040';
    ctx.beginPath(); ctx.moveTo(cx + 3, cy - 15); ctx.lineTo(cx + 9, cy - 13); ctx.lineTo(cx + 3, cy - 11); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillRect(cx + 1, cy - 16, 2, 2);
    ctx.fillStyle = '#e04030'; starPath(cx, cy + 1, 5, 2.2); ctx.fill();
  } else {
    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(BASE_X, BASE_Y, TS, TS);
    ctx.fillStyle = '#555';
    [[6, 30, 14, 10], [22, 24, 18, 16], [10, 14, 10, 10], [30, 10, 10, 10]].forEach(([x, y, w, h]) =>
      ctx.fillRect(BASE_X + x, BASE_Y + y, w, h));
    ctx.fillStyle = '#7a7a7a';
    ctx.fillRect(BASE_X + 22, BASE_Y + 6, 3, 20);
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath(); ctx.moveTo(BASE_X + 25, BASE_Y + 6); ctx.lineTo(BASE_X + 38, BASE_Y + 10); ctx.lineTo(BASE_X + 25, BASE_Y + 14); ctx.fill();
  }
}

function miniTank(x, y, c, s = 1, dir = 0) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(dir * Math.PI / 2);
  ctx.fillStyle = c;
  ctx.fillRect(-7, -6, 4, 13); ctx.fillRect(3, -6, 4, 13);

}

function drawPowerup(u) {
  if (u.t < 5 && Math.floor(time * 8) % 2) return;
  const x = u.x + 4, y = u.y + 4, s = 40, cx = u.x + 24, cy = u.y + 24;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = '#1b2a6b'; ctx.fillRect(x + 3, y + 3, s - 6, s - 6);
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
  switch (u.type) {
    case 'helmet':
      ctx.beginPath(); ctx.arc(cx, cy + 4, 12, Math.PI, 0); ctx.fill();
      ctx.fillRect(cx - 15, cy + 3, 30, 4);
      break;
    case 'star':
      ctx.fillStyle = '#ffd23a'; starPath(cx, cy + 1, 14, 6); ctx.fill();
      break;
    case 'grenade':
      ctx.fillStyle = '#6fbf4a'; circle(cx, cy + 3, 10);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 3, cy - 12, 6, 6);
      ctx.beginPath(); ctx.arc(cx + 6, cy - 10, 4, Math.PI, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#2f5f20'; ctx.fillRect(cx - 9, cy + 2, 18, 2); ctx.fillRect(cx - 1, cy - 6, 2, 18);
      break;
    case 'clock':
      ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.fillRect(cx - 1.5, cy - 9, 3, 10); ctx.fillRect(cx - 1.5, cy - 1.5, 8, 3);
      break;

      ctx.fillRect(-1.5, -15, 3, 18); ctx.fillRect(-5, -16, 10, 3);
      ctx.beginPath(); ctx.moveTo(-7, 3); ctx.lineTo(7, 3); ctx.lineTo(7, 10); ctx.lineTo(0, 16); ctx.lineTo(-7, 10); ctx.fill();
      ctx.restore();

function drawWorld() {
  const wf = Math.floor(time * 2) % 2;
  if (drawnGrid !== V.grid || drawnVer !== V.gridVer || wf !== lastWF) {

  ctx.drawImage(mapC, 0, 0);
  drawBase();

  for (const s of V.stars) {
    const k = 0.5 + 0.5 * Math.abs(Math.sin(time * 9));
    ctx.save();
    ctx.translate(s.x + 24, s.y + 24);
    ctx.rotate(time * 3);
    ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * k})`;

  for (const t of V.players) if (t.alive) drawTank(t);

    g.addColorStop(0.7, `rgba(255,90,20,${0.75 * (1 - p)})`);
    g.addColorStop(1, 'rgba(120,20,0,0)');
    ctx.fillStyle = g;

  } else if (net.status === 'error') {
    text(net.msg, W / 2, 330, 14, '#e8402a');
    text('ПРОВЕРЬТЕ, ЧТО СЕРВЕР ЗАПУЩЕН (npm start)', W / 2, 372, 8, '#8a8a8a');
    text('ENTER — В МЕНЮ', W / 2, 520, 10, '#ccc');
  }
  if (net.noticeT > 0) text(net.notice, W / 2, 440, 12, '#e8402a');
  if (net.status !== 'error') text('ESC — ОТМЕНА', W / 2, 520, 10, '#ccc');
}

function draw() {
  if (mode === 'menu' || mode === 'connect') { drawTitle(); return; }
  if (mode === 'net' && (net.status !== 'playing' || !V)) { drawNetStatus(); return; }
  ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0, 0, W, H);
  drawWorld();
  drawPanel();
  if (V.state === 'intro') {
    const a = Math.min(1, V.stateT);
    ctx.fillStyle = `rgba(110,110,110,${a})`;
    ctx.fillRect(OX, OY, FS, FS);
    text('УРОВЕНЬ ' + V.level, OX + FS / 2, OY + FS / 2, 24, `rgba(0,0,0,${a})`);
  } else if (V.state === 'done') {
    const lines = [['УРОВЕНЬ ' + V.level + ' ПРОЙДЕН!', 16, '#ffd23a']];
    V.players.forEach((p, i) => lines.push([(i ? 'II' : 'I') + ' ИГРОК: ' + p.score, 12, '#fff']));
    curtainBox(lines);
  } else if (V.state === 'dying') {
    const k = Math.min(1, 3 - V.stateT);
    text('ИГРА ОКОНЧЕНА', OX + FS / 2, OY + FS + 20 - k * (FS / 2 + 20), 24, '#e8402a');
  } else if (V.state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(OX, OY, FS, FS);
    const lines = [['ИГРА ОКОНЧЕНА', 22, '#e8402a'], ['УРОВЕНЬ ' + V.level, 12, '#ccc']];
    V.players.forEach((p, i) => lines.push([(i ? 'II' : 'I') + ' ИГРОК: ' + p.score, 12, '#fff']));
    lines.push(['РЕКОРД: ' + hiscore, 12, '#ffd23a']);
    if (V.stateT <= 0) lines.push([mode === 'net' ? 'ENTER — ЕЩЁ РАЗ, ESC — ВЫХОД' : 'ENTER — В МЕНЮ', 10, '#aaa']);
    curtainBox(lines, 0.85);
  }
  if (V.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(OX, OY, FS, FS);
    if (Math.floor(time * 2) % 2) text('ПАУЗА', OX + FS / 2, OY + FS / 2, 28, '#e8402a');
    if (mode === 'local') text('Q — ВЫХОД В МЕНЮ', OX + FS / 2, OY + FS / 2 + 50, 10, '#ccc');
  }
}

// ===== Главный цикл =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  time += dt;
  if (menuMsgT > 0) menuMsgT -= dt;
  if (net.noticeT > 0) net.noticeT -= dt;
  readPads();
  padActions();
  if (mode === 'local') {
    game.setInput(0, inputDir(0), fireHeld(0));
    if (V.twoP) game.setInput(1, inputDir(1), fireHeld(1));
    game.tick(dt);
  } else if (mode === 'net' && net.status === 'playing') {
    sendInput();
    if (V) interpolate();
  }
  updateFx(dt);
  trackHiscore();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
